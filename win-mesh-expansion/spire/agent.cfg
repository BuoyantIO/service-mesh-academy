agent {
    data_dir = "C:\\spire\\data\\agent"
    log_level = "INFO"
    trust_domain = "cluster.local"
    log_file = "C:\\spire\\logs\\agent.log"
    # Address of the SPIRE server VM. setup-spire.ps1 rewrites this from
    # -ServerAddress; it is only 127.0.0.1 when the server runs on this machine.
    server_address = "127.0.0.1"
    server_port = 8081

    # Verify the server's certificate against the trust bundle (upstream CA +
    # Linkerd root) rather than trusting it blindly. This replaces
    # insecure_bootstrap, which was tolerable only while the agent talked to a
    # server on loopback - over the VM subnet it would accept any responder.
    trust_bundle_path = "C:\\spire\\certs\\bundle.crt"
}

plugins {
   KeyManager "disk" {
        plugin_data {
            directory = "C:\\spire\\data\\agent"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }

    WorkloadAttestor "windows" {
        plugin_data {}
    }
}