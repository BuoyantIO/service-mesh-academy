server {
    bind_address = "127.0.0.1"
    bind_port = "8081"
    trust_domain = "cluster.local"
    data_dir = "C:\\spire\\data\\server"
    log_level = "INFO"
    log_file = "C:\\spire\\logs\\server.log"
    ca_ttl = "288h"
    default_x509_svid_ttl = "168h"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "C:\\spire\\data\\server\\datastore.sqlite3"
        }
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "C:\\spire\\data\\server\\keys.json"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }

    UpstreamAuthority "disk" {
        plugin_data {
            cert_file_path   = "C:\\spire\\certs\\ca.crt"
            key_file_path    = "C:\\spire\\certs\\ca.key"
            bundle_file_path = "C:\\spire\\certs\\bundle.crt"
        }
    }
}