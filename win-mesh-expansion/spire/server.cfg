server {
    # 0.0.0.0 so agents on the other VMs can reach this server. Go renders a
    # wildcard bind as a dual-stack "::" listener, so Get-NetTCPConnection shows
    # "::" rather than "0.0.0.0" - that is correct, not a failure. The server VM
    # must also allow inbound 8081 from the VM subnet (setup-spire.ps1 adds it).
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "cluster.local"
    data_dir = "C:\\spire\\data\\server"
    log_level = "INFO"
    log_file = "C:\\spire\\logs\\server.log"
    ca_ttl = "288h"
    default_x509_svid_ttl = "168h"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "C:\\spire\\data\\server\\datastore.sqlite3"
        }
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "C:\\spire\\data\\server\\keys.json"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }

    UpstreamAuthority "disk" {
        plugin_data {
            cert_file_path   = "C:\\spire\\certs\\ca.crt"
            key_file_path    = "C:\\spire\\certs\\ca.key"
            bundle_file_path = "C:\\spire\\certs\\bundle.crt"
        }
    }
}